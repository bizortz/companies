# Single source of truth for per-agent model tier assignment.
#
# Tiering is set PER AGENT, never per skill — no SKILL.md in this package
# declares a `model:` key (see docs/model-tiers.md and DECISIONS.md). Every
# agent's own agents/<slug>/AGENTS.md frontmatter `metadata.modelTier` /
# `metadata.model` / `metadata.effort` must agree exactly with this file —
# scripts/validate.sh enforces that.
#
# Tier 1 = claude-opus-5-5, effort high   — decides only, no drafting.
# Tier 2 = claude-sonnet-5, effort low    — owns execution in its domain.
# Tier 3 = claude-haiku-4-5-20251001, effort auto (omitted) — fixed-template,
#          high-volume, rule-following work only.
#
# Counts: 6 Tier 1, 41 Tier 2, 2 Tier 3 = 49 total.
#
# Changing a tier is a CEO decision, logged to ops/decision-log.md.
# org-improvement-lead may PROPOSE a change here but must never edit this
# file directly (see its AGENTS.md Must-NOT list).

version: 1

tiers:
  ceo: { tier: 1, model: claude-opus-5-5, effort: high }
  creative-director: { tier: 1, model: claude-opus-5-5, effort: high }
